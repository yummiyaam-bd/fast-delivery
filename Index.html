<style>
:root{--bg:#f4f7f5;--card:#fff;--ink:#12302a;--mut:#5d7a72;--pri:#0f8f6f;--pri2:#0a5c48;--acc:#ff8a1f;--line:#dbe6e1;--hero:#0a3d33;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);box-sizing:border-box}

*{box-sizing:border-box;margin:0}
body{font-family:system-ui,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink);line-height:1.5;max-width:1100px;margin:auto}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--hero);color:#fff;padding:12px 16px}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.logo{font-size:22px;font-weight:800;color:#7df0c8;cursor:pointer}.logo small{display:block;font-size:11px;font-weight:400;color:#bfe6da}
.btn{border:0;cursor:pointer;font:inherit;border-radius:12px;color:inherit;background:none}
.area{background:#ffffff1f;color:#fff;padding:8px 12px;font-size:13px;max-width:52%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hr2{display:flex;gap:8px;margin-top:10px}
.search{flex:1;padding:12px 14px;border-radius:14px;border:0;font:inherit;background:#fff;color:#12302a}
.trk{background:var(--acc);color:#2b1400;padding:0 14px;font-weight:700;font-size:13px}
main{padding:16px}
.late{display:inline-block;margin:0 0 12px;padding:5px 12px;border-radius:20px;font-size:12px;font-weight:700;background:#0f8f6f22;color:var(--pri)}
.slider{position:relative;overflow:hidden;border-radius:18px}
.track{display:flex;transition:transform .5s}
.slide{min-width:100%;padding:26px 22px;color:#fff;min-height:170px;display:flex;flex-direction:column;justify-content:center}
.slide h2{font-size:26px;line-height:1.2}.slide p{margin-top:6px;opacity:.9}
.s1{background:linear-gradient(120deg,#0a5c48,#0f8f6f)}.s2{background:linear-gradient(120deg,#7a2e00,#ff8a1f)}.s3{background:linear-gradient(120deg,#1d2b64,#4a6fd8)}.s4{background:linear-gradient(120deg,#5b1d6e,#c04a9a)}
.dots{position:absolute;bottom:10px;left:0;right:0;display:flex;justify-content:center;gap:6px}
.dots i{width:7px;height:7px;border-radius:9px;background:#fff6;transition:.3s}.dots i.on{width:22px;background:#fff}
h3{font-size:20px;margin:26px 0 12px}
.cats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
@media(min-width:700px){.cats{grid-template-columns:repeat(6,1fr)}}
.cat{background:var(--card);border:1px solid var(--line);padding:14px 6px;text-align:center;font-size:13px}
.cat b{display:block;font-size:28px;margin-bottom:4px}.cat.on{background:var(--pri);color:#fff;border-color:var(--pri)}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:8px}
.chip{white-space:nowrap;background:var(--card);border:1px solid var(--line);padding:7px 14px;font-size:13px;border-radius:20px}.chip.on{background:var(--pri);color:#fff}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
@media(min-width:700px){.grid{grid-template-columns:repeat(4,1fr)}}
.hs{display:flex;gap:12px;overflow-x:auto;padding-bottom:6px}.hs .p{min-width:165px}
.sec{display:flex;justify-content:space-between;align-items:center}.sec h3{margin:22px 0 10px}
.va{border:1px solid var(--acc);color:var(--acc);padding:5px 12px;font-size:13px}
.p{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:6px}
.p .im{font-size:44px;text-align:center;background:var(--bg);border-radius:12px;padding:10px 0;cursor:pointer}
.p .n{font-size:14px;font-weight:600;min-height:40px;cursor:pointer}
.r{display:flex;align-items:center;justify-content:space-between}
.pr{font-weight:800;color:var(--pri)}.add{background:var(--acc);color:#2b1400;padding:7px 14px;font-weight:700}
.add[disabled]{background:var(--line);color:var(--mut);cursor:not-allowed;font-size:12px}
.qty{display:flex;align-items:center;gap:8px;font-weight:700}.qty button{width:28px;height:28px;border-radius:50%;background:var(--pri);color:#fff}
.tag{font-size:11px;color:var(--mut)}
.more{display:block;margin:20px auto;border:1px solid var(--acc);color:var(--acc);padding:12px 26px;font-weight:700}
.why{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.why div{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;text-align:center}
footer{padding:30px 16px 120px;text-align:center;color:var(--mut);font-size:13px}
.fab{position:fixed;right:14px;width:52px;height:52px;border-radius:50%;color:#fff;font-size:24px;display:grid;place-items:center;text-decoration:none;box-shadow:0 4px 14px #0004;z-index:15}
#wa{bottom:calc(86px + env(safe-area-inset-bottom,0px));background:#25d366}#hp{bottom:calc(148px + env(safe-area-inset-bottom,0px));background:var(--acc)}
.bar{position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));background:var(--pri2);color:#fff;padding:14px 18px;display:none;z-index:15;max-width:1076px;margin:auto}
.bar.show{display:flex}
.fb{position:fixed;left:12px;bottom:calc(86px + env(safe-area-inset-bottom,0px));background:var(--card);border:1px solid var(--line);padding:8px 14px;font-size:13px;z-index:15}
.ov{position:fixed;inset:0;background:#0008;display:none;z-index:30;align-items:flex-end}.ov.show{display:flex}
.sheet{background:var(--card);width:100%;max-width:620px;margin:auto;border-radius:22px 22px 0 0;padding:18px;max-height:85%;overflow:auto}
.li{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid var(--line);gap:10px}
.li small{display:block;color:var(--mut)}
.chk{width:100%;margin-top:14px;padding:14px;background:var(--pri);color:#fff;font-weight:700}
input.f{width:100%;padding:11px;margin-top:8px;border:1px solid var(--line);border-radius:12px;font:inherit;background:var(--bg);color:var(--ink)}
.empty{color:var(--mut);padding:30px 0;text-align:center}
.big{font-size:90px;text-align:center;background:var(--bg);border-radius:16px;padding:20px}
.sum{display:flex;justify-content:space-between;padding:4px 0}
.step{display:flex;gap:10px;padding:8px 0;color:var(--mut)}.step.done{color:var(--pri);font-weight:700}
.q{display:block;width:100%;text-align:left;padding:10px 12px;margin-top:8px;border:1px solid var(--line);border-radius:12px;background:var(--bg)}
.ans{background:var(--pri);color:#fff;padding:10px 12px;border-radius:12px;margin-top:8px}
.store{display:flex;gap:10px;align-items:center;background:var(--card);border:1px solid var(--line);padding:12px;text-align:left;min-width:230px;border-radius:14px;color:var(--ink)}.store .si{font-size:32px}
@keyframes inn{from{transform:translateX(40px);opacity:0}to{transform:none;opacity:1}}@keyframes outt{to{transform:translateX(40px);opacity:0}}@keyframes backin{from{transform:translateX(-40px);opacity:0}to{transform:none;opacity:1}}
.in{animation:inn .28s ease}.out{animation:outt .17s ease forwards}.back{animation:backin .28s ease}
@media(prefers-reduced-motion:reduce){.in,.out,.back{animation:none}}
